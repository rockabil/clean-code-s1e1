<DOCTYPE html>
<html lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Todo App</title>
        <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" type="text/css">
        <link rel="stylesheet" href="style.css">       
    <body>
        <header class="header">
            <h1>The Eisenhower Matrix</h1>
            <div class="header-content">
                <img src="./img/eisenhower-matrix.jpg" alt="Eisenhower Matrix diagram showing urgent vs important tasks">
                <a class="header-link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
            </div>            
        </header>
        <main class="main">
            <section class="todo-section">
                <form class="todo-form" id="topSectionForAddingElementToList">
                    <label for="new-task" class="todo-form__label">Add Item</label>
                    <div class="todo-form__row">
                        <input id="new-task" class="todo-form__input" type="text" aria-label="New task">
                        <button class="todo-form__button" type="button">Add</button>
                    </div>
                </form>
                <section class="todo-list">
                    <h3 class="todo-list-title">Todo</h3>
                    <ul class="todo-list-items" id="incompleteTasks">
                        <li class="todo-item">
                            <input class="todo-item-checkbox" type="checkbox">
                            <label class="todo-item-label">Pay Bills</label>
                            <input class="todo-item-input" type="text">
                            <button class="todo-item-button todo-item-button-edit">Edit</button>
                            <button class="todo-item-button todo-item-button-delete">
                                <img src="./img/svg/remove.svg" alt="Delete task">
                            </button>
                        </li>
                        <li class="todo-item todo-item-edit-mode">
                            <input class="todo-item-checkbox" type="checkbox">
                            <label class="todo-item-label">Go Shopping</label>
                            <input class="todo-item-input" type="text" value="Go Shopping">
                            <button class="todo-item-button todo-item-button-edit">Save</button>
                            <button class="todo-item-button todo-item-button-delete">
                                <img src="./img/svg/remove.svg" alt="Delete task">
                            </button>
                        </li>
                    </ul>
                </section>
                <section class="completed-list">
                    <h3 class="completed-list-title">Completed</h3>
                    <ul class="completed-list-items" id="completed-tasks">
                        <li class="todo-item">
                            <input class="todo-item-checkbox" type="checkbox" checked>
                            <label class="todo-item-label">See the Doctor</label>
                            <input class="todo-item-input" type="text">
                            <button class="todo-item-button todo-item-button-edit">Edit</button>
                            <button class="todo-item-button todo-item-button-delete">
                                <img src="./img/svg/remove.svg" alt="Delete task">
                            </button>
                        </li>
                    </ul>
                </section>
            </section>
        </main>
        <script type="text/javascript" SRC="app.js"></script>
    </body>
</html>
